    <marker id="arr-a06-pantilt-loop-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <circle class="box" cx="70" cy="90" r="18"/>
  <text class="lbl" x="70" y="95" text-anchor="middle">Σ</text>
