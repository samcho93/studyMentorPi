<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="원근 변환으로 영상의 사다리꼴 차로를 조감도의 직사각형으로 펴기">
  <defs>
    <marker id="arr-a09-birdseye" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <!-- left: camera image 640x480 scaled 0.45 at (20,30) -->
  <text class="lbl" x="164" y="20" text-anchor="middle">카메라 영상 (u, v)</text>
  <rect class="box" x="20" y="30" width="288" height="216"/>
  <!-- src: (250,260),(430,260),(620,470),(60,470) -->
  <path class="box-hi" d="M132.5 147 L213.5 147 L299 241.5 L47 241.5 Z" opacity="0.6"/>
  <path d="M47 241.5 L132.5 147" style="stroke:var(--warn)" stroke-width="4"/>
  <path d="M299 241.5 L213.5 147" style="stroke:var(--text-faint)" stroke-width="4"/>
  <circle class="hi" cx="164" cy="241.5" r="4"/>
  <text class="tag" x="170" y="236">로봇(320, 470)</text>
  <text class="tag" x="132" y="140" text-anchor="end">(250,260)</text>
  <text class="tag" x="214" y="140">(430,260)</text>
  <text class="sub" x="164" y="268" text-anchor="middle">평행한 차선이 한 점으로 모여 보임</text>

  <path class="ln-hi" d="M325 140 L395 140" stroke-width="2.5" marker-end="url(#arr-a09-birdseye)"/>
  <text class="lbl mono" x="360" y="128" text-anchor="middle">H (3×3)</text>
  <text class="tag" x="360" y="162" text-anchor="middle">대응점 4쌍</text>

  <!-- right: bird's eye 640x480 scaled 0.45 at (410,30) -->
  <text class="lbl" x="554" y="20" text-anchor="middle">조감도 (X, Y)</text>
  <rect class="box" x="410" y="30" width="288" height="216"/>
  <!-- dst rect x 170..470 → 486.5..621.5 -->
  <rect class="box-hi" x="486.5" y="30" width="135" height="216" opacity="0.6"/>
  <path d="M486.5 30 L486.5 246" style="stroke:var(--warn)" stroke-width="4"/>
  <path d="M621.5 30 L621.5 246" style="stroke:var(--text-faint)" stroke-width="4"/>
  <circle class="hi" cx="549" cy="241.5" r="4"/>
  <path class="ln" d="M554 60 L554 246" stroke-dasharray="4 3"/>
  <text class="tag" x="550" y="72" text-anchor="end">차로 중심 320</text>
  <text class="tag" x="545" y="232" text-anchor="end">309.3</text>
  <text class="sub" x="554" y="268" text-anchor="middle">차선이 평행, 1 px = 1.5 mm → 횡오차 −0.016 m</text>
</svg>
