    <marker id="arr-a03-loop-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <rect class="box" x="10" y="40" width="120" height="64" rx="6"/>
  <text class="lbl" x="70" y="66" text-anchor="middle">카메라</text>
  <text class="tag mono" x="70" y="86" text-anchor="middle">rgb0/image</text>
