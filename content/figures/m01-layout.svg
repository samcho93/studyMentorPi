<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MentorPi 메카넘 섀시를 위에서 본 모습: 모터 번호, 접지 롤러 방향, 좌표축, 치수와 바퀴 속도 식">
  <defs>
    <marker id="arr-m01-layout" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
    <marker id="arr-m01-layout-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
  </defs>
  <!-- chassis -->
  <rect class="box" x="140" y="70" width="160" height="180" rx="10"/>
  <text class="tag" x="220" y="238" text-anchor="middle">본체 (위에서 본 모습)</text>
  <!-- wheels: centers FL(110,105) RL(110,215) FR(330,105) RR(330,215) -->
  <rect class="box-hi" x="95" y="75" width="30" height="60" rx="6"/>
  <rect class="box-hi" x="95" y="185" width="30" height="60" rx="6"/>
  <rect class="box-hi" x="315" y="75" width="30" height="60" rx="6"/>
  <rect class="box-hi" x="315" y="185" width="30" height="60" rx="6"/>
  <!-- contact-roller axes: M1, M4 '\' ; M2, M3 '/' -->
  <g style="stroke:var(--accent)" stroke-width="2">
    <path d="M100 88 L120 108 M100 102 L120 122 M100 116 L120 136"/>
    <path d="M320 198 L340 218 M320 212 L340 232 M320 226 L340 246"/>
    <path d="M100 208 L120 188 M100 222 L120 202 M100 236 L120 216"/>
    <path d="M320 98 L340 78 M320 112 L340 92 M320 126 L340 106"/>
  </g>
  <text class="lbl" x="86" y="100" text-anchor="end">M1</text>
  <text class="sub" x="86" y="116" text-anchor="end">앞·왼쪽</text>
  <text class="lbl" x="86" y="210" text-anchor="end">M2</text>
  <text class="sub" x="86" y="226" text-anchor="end">뒤·왼쪽</text>
  <text class="lbl" x="354" y="100" text-anchor="start">M3</text>
  <text class="sub" x="354" y="116" text-anchor="start">앞·오른쪽</text>
  <text class="lbl" x="354" y="210" text-anchor="start">M4</text>
  <text class="sub" x="354" y="226" text-anchor="start">뒤·오른쪽</text>
  <!-- axes at centre (220,160) -->
  <circle cx="220" cy="160" r="4" style="fill:var(--text)"/>
  <path class="ln-hi" d="M220 160 L220 100" stroke-width="2.2" marker-end="url(#arr-m01-layout)"/>
  <text class="lbl mono" x="228" y="104" text-anchor="start">x 전방</text>
  <path class="ln-hi" d="M220 160 L165 160" stroke-width="2.2" marker-end="url(#arr-m01-layout)"/>
  <text class="lbl mono" x="170" y="150" text-anchor="start">y</text>
  <path class="ln-hi" d="M250 146 A32 32 0 1 0 246 178" stroke-width="1.6" marker-end="url(#arr-m01-layout)"/>
  <text class="lbl mono" x="258" y="190" text-anchor="start">ωz +</text>
  <!-- dimensions -->
  <path d="M110 268 L330 268" style="stroke:var(--text-faint)" stroke-width="1.2" marker-start="url(#arr-m01-layout-dim)" marker-end="url(#arr-m01-layout-dim)"/>
  <text class="sub mono" x="220" y="286" text-anchor="middle">b = track_width 0.1446 m</text>
  <path d="M44 105 L44 215" style="stroke:var(--text-faint)" stroke-width="1.2" marker-start="url(#arr-m01-layout-dim)" marker-end="url(#arr-m01-layout-dim)"/>
  <text class="sub mono" x="36" y="160" text-anchor="middle" transform="rotate(-90 36 160)">a = wheelbase 0.1368 m</text>
  <text class="tag" x="220" y="312" text-anchor="middle">주황 사선 = 바닥에 닿은 롤러의 축 방향 (M1·M4 "\" , M2·M3 "/")</text>
  <!-- formula panel -->
  <rect class="box" x="430" y="40" width="275" height="250" rx="8"/>
  <text class="lbl" x="445" y="66">바퀴 접지 속도 [m/s]</text>
  <text class="sub mono" x="445" y="86">K = (a + b) / 2 = 0.1407 m</text>
  <text class="lbl mono" x="445" y="114">v1 = vx − vy − K·ωz</text>
  <text class="lbl mono" x="445" y="136">v2 = vx + vy − K·ωz</text>
  <text class="lbl mono" x="445" y="158">v3 = vx + vy + K·ωz</text>
  <text class="lbl mono" x="445" y="180">v4 = vx − vy + K·ωz</text>
  <text class="lbl" x="445" y="212">모터 명령 [rps]</text>
  <text class="lbl mono" x="445" y="234">[−v1, −v2, +v3, +v4] / (π·d)</text>
  <text class="sub" x="445" y="256">d = 0.065 m, π·d = 0.2042 m/회전</text>
  <text class="sub" x="445" y="276">왼쪽 모터(M1·M2)는 거울 장착 → 부호 반전</text>
</svg>
