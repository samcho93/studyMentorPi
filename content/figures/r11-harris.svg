<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="고윳값 lambda1, lambda2 평면에서 평탄, 엣지, 코너 영역">
  <defs>
    <marker id="arr-r11-harris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
  </defs>
  <path class="box-hi" d="M170 60 L370 60 L370 200 L170 200 Z" style="opacity:0.35"/>
  <path class="ln" d="M60 260 L60 30" stroke-width="1.4" marker-end="url(#arr-r11-harris)"/>
  <path class="ln" d="M60 260 L400 260" stroke-width="1.4" marker-end="url(#arr-r11-harris)"/>
  <text class="lbl mono" x="408" y="264">λ1</text>
  <text class="lbl mono" x="52" y="26" text-anchor="end">λ2</text>
  <path class="ln-hi" d="M170 260 L170 40 M60 200 L390 200" stroke-width="1.4" fill="none" stroke-dasharray="6 4"/>
  <text class="lbl" x="115" y="235" text-anchor="middle">평탄</text>
  <text class="sub" x="115" y="252" text-anchor="middle">λ1, λ2 작음</text>
  <text class="lbl" x="270" y="235" text-anchor="middle">엣지</text>
  <text class="sub" x="270" y="252" text-anchor="middle">λ1 ≫ λ2</text>
  <text class="lbl" x="110" y="110" text-anchor="middle">엣지</text>
  <text class="sub" x="110" y="128" text-anchor="middle">λ2 ≫ λ1</text>
  <text class="lbl" x="270" y="125" text-anchor="middle">코너</text>
  <text class="sub" x="270" y="143" text-anchor="middle">λ1, λ2 모두 큼</text>
  <text class="lbl" x="460" y="80">Shi-Tomasi</text>
  <text class="sub mono" x="460" y="100">R = min(λ1, λ2) &gt; 임계값</text>
  <text class="sub" x="460" y="118">→ 점선 오른쪽 위 영역 (코너)</text>
  <text class="lbl" x="460" y="160">Harris</text>
  <text class="sub mono" x="460" y="180">R = λ1·λ2 − k(λ1+λ2)²</text>
  <text class="sub" x="460" y="198">R &gt; 0 크면 코너, R &lt; 0 엣지</text>
  <text class="sub" x="460" y="216">경계가 곡선 (k = 0.04~0.06)</text>
</svg>
