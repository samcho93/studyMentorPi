<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="실물 드라이버 또는 Gazebo가 토픽을 내고 RViz2, rqt, ros2 bag, 알고리즘 노드가 이를 사용하는 구조">
  <defs>
    <marker id="arr-r07-tools" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <text class="sub" x="110" y="26" text-anchor="middle">둘 중 하나가 데이터 원천</text>
  <rect class="box" x="20" y="40" width="180" height="80" rx="10"/>
  <text class="lbl" x="110" y="64" text-anchor="middle">실물 MentorPi</text>
  <text class="tag" x="110" y="84" text-anchor="middle">라이다·모터·IMU 드라이버</text>
  <text class="tag" x="110" y="102" text-anchor="middle">controller.launch.py</text>
  <text class="lbl" x="110" y="146" text-anchor="middle">또는</text>
  <rect class="box" x="20" y="162" width="180" height="80" rx="10"/>
  <text class="lbl" x="110" y="186" text-anchor="middle">Gazebo</text>
  <text class="tag" x="110" y="206" text-anchor="middle">물리 엔진 + 센서 모델</text>
  <text class="tag mono" x="110" y="224" text-anchor="middle">/clock, use_sim_time</text>

  <rect class="box-hi" x="260" y="60" width="170" height="162" rx="10"/>
  <text class="lbl" x="345" y="84" text-anchor="middle">토픽 + TF</text>
  <text class="tag mono" x="345" y="108" text-anchor="middle">/scan  /odom  /imu</text>
  <text class="tag mono" x="345" y="128" text-anchor="middle">/tf  /tf_static</text>
  <text class="tag mono" x="345" y="148" text-anchor="middle">/robot_description</text>
  <text class="tag mono" x="345" y="168" text-anchor="middle">/map  /plan</text>
  <text class="tag mono" x="345" y="196" text-anchor="middle">← /cmd_vel</text>

  <path class="ln-hi" d="M202 80 L257 110" stroke-width="2" marker-end="url(#arr-r07-tools)"/>
  <path class="ln-hi" d="M202 202 L257 172" stroke-width="2" marker-end="url(#arr-r07-tools)"/>

  <rect class="box" x="500" y="30" width="200" height="46" rx="10"/>
  <text class="lbl" x="600" y="50" text-anchor="middle">RViz2</text>
  <text class="sub" x="600" y="67" text-anchor="middle">3D 시각화 · 목표 지정</text>
  <rect class="box" x="500" y="90" width="200" height="46" rx="10"/>
  <text class="lbl" x="600" y="110" text-anchor="middle">rqt</text>
  <text class="sub" x="600" y="127" text-anchor="middle">로그 · 그래프 · 수동 발행</text>
  <rect class="box" x="500" y="150" width="200" height="46" rx="10"/>
  <text class="lbl" x="600" y="170" text-anchor="middle">ros2 bag</text>
  <text class="sub" x="600" y="187" text-anchor="middle">녹화 · 재생</text>
  <rect class="box" x="500" y="210" width="200" height="46" rx="10"/>
  <text class="lbl" x="600" y="230" text-anchor="middle">SLAM · Nav2 · 앱 노드</text>
  <text class="sub" x="600" y="247" text-anchor="middle">코드 수정 없이 동작</text>

  <path class="ln-hi" d="M432 100 L497 56" stroke-width="1.6" marker-end="url(#arr-r07-tools)"/>
  <path class="ln-hi" d="M432 125 L497 113" stroke-width="1.6" marker-end="url(#arr-r07-tools)"/>
  <path class="ln-hi" d="M432 155 L497 172" stroke-width="1.6" marker-end="url(#arr-r07-tools)"/>
  <path class="ln-hi" d="M432 180 L497 230" stroke-width="1.6" marker-end="url(#arr-r07-tools)"/>
  <text class="sub" x="360" y="284" text-anchor="middle">데이터 원천을 바꿔도 오른쪽 도구와 노드는 같은 토픽 이름·타입으로 연결됩니다</text>
</svg>
