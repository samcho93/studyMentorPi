<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR 배송 로봇의 ROS 2 그래프: 카메라 영상, 배송 요청·수령 확인 서비스, 버튼 입력이 delivery_bot으로 들어가고, delivery_bot은 Nav2 navigate_to_pose 액션으로 주행하며 상태 토픽과 RGB·부저를 발행">
  <defs>
    <marker id="arr-p02-graph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
    <marker id="arr-p02-graph-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <text class="tag" x="100" y="20" text-anchor="middle">입력</text>
  <text class="tag" x="391" y="20" text-anchor="middle">이 프로젝트의 노드</text>
  <text class="tag" x="630" y="20" text-anchor="middle">출력 · 주행</text>

  <!-- inputs -->
  <rect class="box" x="20" y="34" width="160" height="50" rx="6"/>
  <text class="lbl" x="100" y="55" text-anchor="middle">깊이 카메라 RGB</text>
  <text class="sub mono" x="100" y="72" text-anchor="middle">depth_camera.launch.py</text>
  <rect class="box" x="20" y="130" width="160" height="60" rx="6"/>
  <text class="lbl" x="100" y="152" text-anchor="middle">접수 데스크 · 앱</text>
  <text class="sub" x="100" y="170" text-anchor="middle">ros2 service call</text>
  <text class="sub" x="100" y="183" text-anchor="middle">(확장: Deliver 액션)</text>
  <rect class="box" x="20" y="240" width="160" height="50" rx="6"/>
  <text class="lbl mono" x="100" y="261" text-anchor="middle" style="font-size:11.5px">ros_robot_controller</text>
  <text class="sub" x="100" y="278" text-anchor="middle">보드 버튼 → ~/button</text>

  <!-- node -->
  <rect class="box-hi" x="306" y="120" width="170" height="92" rx="8"/>
  <text class="lbl mono" x="391" y="144" text-anchor="middle">delivery_bot</text>
  <text class="sub" x="391" y="164" text-anchor="middle">QR 해석 → 목적지 조회표</text>
  <text class="sub" x="391" y="180" text-anchor="middle">배송 상태 기계</text>
  <text class="sub" x="391" y="196" text-anchor="middle">재시도 · 재계획 · 복귀</text>

  <!-- outputs -->
  <rect class="box" x="560" y="34" width="145" height="60" rx="6"/>
  <text class="lbl" x="632" y="56" text-anchor="middle">Nav2</text>
  <text class="sub mono" x="632" y="73" text-anchor="middle">bt_navigator</text>
  <text class="sub mono" x="632" y="87" text-anchor="middle">amcl (TF)</text>
  <rect class="box" x="560" y="146" width="145" height="44" rx="6"/>
  <text class="lbl mono" x="632" y="165" text-anchor="middle" style="font-size:12px">/delivery/status</text>
  <text class="sub" x="632" y="181" text-anchor="middle">모니터 · 기록</text>
  <rect class="box" x="560" y="240" width="145" height="50" rx="6"/>
  <text class="lbl mono" x="632" y="261" text-anchor="middle">set_rgb</text>
  <text class="lbl mono" x="632" y="279" text-anchor="middle">set_buzzer</text>

  <!-- input arrows -->
  <path class="ln" d="M180 64 L330 118" stroke-width="1.4" marker-end="url(#arr-p02-graph)"/>
  <text class="tag mono" x="196" y="116">…/rgb0/image</text>
  <path class="ln-hi" d="M180 150 L304 150" stroke-width="2" marker-end="url(#arr-p02-graph-hi)"/>
  <text class="tag mono" x="186" y="143">/delivery/request</text>
  <path class="ln-hi" d="M180 176 L304 176" stroke-width="2" marker-end="url(#arr-p02-graph-hi)"/>
  <text class="tag mono" x="186" y="192">/delivery/confirm</text>
  <path class="ln" d="M180 262 L316 214" stroke-width="1.4" marker-end="url(#arr-p02-graph)"/>
  <text class="tag" x="214" y="262">수령 버튼</text>

  <!-- action to nav2 -->
  <path class="ln-hi" d="M476 136 L558 70" stroke-width="2" marker-end="url(#arr-p02-graph-hi)"/>
  <path class="ln" d="M560 84 L480 146" stroke-width="1.2" marker-end="url(#arr-p02-graph)" stroke-dasharray="4 3"/>
  <text class="tag mono" x="524" y="60" text-anchor="end">navigate_to_pose</text>
  <text class="tag" x="528" y="132">피드백·결과·TF</text>
  <!-- status, led -->
  <path class="ln-hi" d="M476 168 L558 168" stroke-width="2" marker-end="url(#arr-p02-graph-hi)"/>
  <path class="ln-hi" d="M476 200 L558 256" stroke-width="2" marker-end="url(#arr-p02-graph-hi)"/>
  <text class="tag" x="548" y="282" text-anchor="end">도착 알림 · 오류 경고</text>

  <text class="sub" x="360" y="330" text-anchor="middle">서비스는 즉시 응답(접수/거절)하고, 긴 주행은 상태 기계가 액션으로 이어서 처리합니다</text>
</svg>
