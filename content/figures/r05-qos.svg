<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QoS 호환표: 신뢰성과 내구성 정책의 발행자-구독자 조합별 연결 여부">
  <text class="lbl" x="180" y="26" text-anchor="middle">Reliability</text>
  <text class="sub" x="228" y="52" text-anchor="middle">구독자 요구 →</text>
  <text class="tag mono" x="180" y="76" text-anchor="middle">RELIABLE</text>
  <text class="tag mono" x="290" y="76" text-anchor="middle">BEST_EFFORT</text>
  <text class="sub" x="66" y="52" text-anchor="middle">발행자 제공 ↓</text>
  <text class="tag mono" x="66" y="120" text-anchor="middle">RELIABLE</text>
  <text class="tag mono" x="66" y="190" text-anchor="middle">BEST_EFFORT</text>
  <rect class="box-hi" x="125" y="88" width="110" height="60" rx="6"/>
  <text class="lbl" x="180" y="115" text-anchor="middle">연결 ✓</text>
  <text class="sub" x="180" y="133" text-anchor="middle">재전송 보장</text>
  <rect class="box-hi" x="235" y="88" width="110" height="60" rx="6"/>
  <text class="lbl" x="290" y="115" text-anchor="middle">연결 ✓</text>
  <text class="sub" x="290" y="133" text-anchor="middle">최선형으로 동작</text>
  <rect class="box" x="125" y="158" width="110" height="60" rx="6" style="stroke:var(--danger)"/>
  <text class="lbl" x="180" y="185" text-anchor="middle" style="fill:var(--danger)">연결 ✗</text>
  <text class="sub" x="180" y="203" text-anchor="middle">QoS 불일치</text>
  <rect class="box-hi" x="235" y="158" width="110" height="60" rx="6"/>
  <text class="lbl" x="290" y="185" text-anchor="middle">연결 ✓</text>
  <text class="sub" x="290" y="203" text-anchor="middle">센서 스트림</text>

  <path class="ln" d="M370 20 L370 250" stroke-width="1"/>

  <text class="lbl" x="560" y="26" text-anchor="middle">Durability</text>
  <text class="sub" x="608" y="52" text-anchor="middle">구독자 요구 →</text>
  <text class="tag mono" x="560" y="76" text-anchor="middle">TRANSIENT_LOCAL</text>
  <text class="tag mono" x="670" y="76" text-anchor="middle">VOLATILE</text>
  <text class="tag mono" x="446" y="114" text-anchor="middle">TRANSIENT</text>
  <text class="tag mono" x="446" y="128" text-anchor="middle">_LOCAL</text>
  <text class="tag mono" x="446" y="190" text-anchor="middle">VOLATILE</text>
  <rect class="box-hi" x="505" y="88" width="110" height="60" rx="6"/>
  <text class="lbl" x="560" y="115" text-anchor="middle">연결 ✓</text>
  <text class="sub" x="560" y="133" text-anchor="middle">과거 값도 받음</text>
  <rect class="box-hi" x="615" y="88" width="100" height="60" rx="6"/>
  <text class="lbl" x="665" y="115" text-anchor="middle">연결 ✓</text>
  <text class="sub" x="665" y="133" text-anchor="middle">새 값만</text>
  <rect class="box" x="505" y="158" width="110" height="60" rx="6" style="stroke:var(--danger)"/>
  <text class="lbl" x="560" y="185" text-anchor="middle" style="fill:var(--danger)">연결 ✗</text>
  <text class="sub" x="560" y="203" text-anchor="middle">QoS 불일치</text>
  <rect class="box-hi" x="615" y="158" width="100" height="60" rx="6"/>
  <text class="lbl" x="665" y="185" text-anchor="middle">연결 ✓</text>
  <text class="sub" x="665" y="203" text-anchor="middle">기본값</text>

  <text class="sub" x="360" y="276" text-anchor="middle">규칙: 구독자가 요구하는 품질 ≤ 발행자가 제공하는 품질일 때만 연결됩니다</text>
</svg>
