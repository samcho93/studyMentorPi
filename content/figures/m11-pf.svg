<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="파티클 필터 한 주기: 예측 단계에서 파티클을 이동하고 퍼뜨리며, 갱신 단계에서 가능도로 가중치를 주고, 재표본 단계에서 무거운 파티클을 복제함">
  <defs>
    <marker id="arr-m11-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <!-- stage titles -->
  <text class="lbl" x="115" y="24" text-anchor="middle">① 예측 (움직임 모델)</text>
  <text class="lbl" x="360" y="24" text-anchor="middle">② 갱신 (센서 모델)</text>
  <text class="lbl" x="605" y="24" text-anchor="middle">③ 재표본</text>
  <!-- stage 1: particles before (faint) and after (moved + spread) -->
  <g style="fill:var(--text-faint)">
    <circle cx="40" cy="120" r="4"/><circle cx="48" cy="112" r="4"/><circle cx="52" cy="128" r="4"/><circle cx="60" cy="118" r="4"/><circle cx="44" cy="136" r="4"/>
  </g>
  <path class="ln-hi" d="M72 120 L120 120" stroke-width="1.6" marker-end="url(#arr-m11-pf)"/>
  <text class="tag" x="96" y="108" text-anchor="middle">u</text>
  <g class="hi">
    <circle cx="140" cy="100" r="4"/><circle cx="162" cy="112" r="4"/><circle cx="150" cy="134" r="4"/><circle cx="176" cy="126" r="4"/><circle cx="134" cy="146" r="4"/>
    <circle cx="186" cy="104" r="4"/><circle cx="158" cy="92" r="4"/>
  </g>
  <text class="sub" x="115" y="186" text-anchor="middle">모든 파티클을 u만큼 옮기고</text>
  <text class="sub" x="115" y="202" text-anchor="middle">alpha 잡음으로 퍼뜨림</text>
  <!-- stage 2: wall and weighted particles -->
  <path d="M430 60 L430 148" style="stroke:var(--text)" stroke-width="4"/>
  <text class="tag" x="436" y="70">벽 (지도)</text>
  <path d="M330 120 L426 120" style="stroke:var(--danger)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="tag" x="360" y="168" text-anchor="middle">스캔 끝점이 벽과 맞을수록 무거움</text>
  <g class="hi">
    <circle cx="300" cy="100" r="3"/><circle cx="322" cy="112" r="9"/><circle cx="310" cy="134" r="5"/><circle cx="336" cy="126" r="11"/>
    <circle cx="294" cy="146" r="2.5"/><circle cx="346" cy="104" r="7"/><circle cx="318" cy="92" r="3"/>
  </g>
  <text class="sub" x="360" y="186" text-anchor="middle">w ← w · p(z | x), 정규화</text>
  <text class="sub" x="360" y="202" text-anchor="middle">가능도장: z_hit·N(d; σ=0.2) + z_rand</text>
  <!-- stage 3: resampled -->
  <g class="hi">
    <circle cx="580" cy="112" r="4"/><circle cx="586" cy="118" r="4"/><circle cx="594" cy="124" r="4"/><circle cx="600" cy="128" r="4"/>
    <circle cx="606" cy="120" r="4"/><circle cx="610" cy="108" r="4"/><circle cx="596" cy="110" r="4"/>
  </g>
  <text class="sub" x="605" y="186" text-anchor="middle">가중치 비례로 N개 다시 뽑기</text>
  <text class="sub" x="605" y="202" text-anchor="middle">(저분산 재표본, 가중치 1/N)</text>
  <!-- arrows between stages -->
  <path class="ln-hi" d="M222 120 L262 120" stroke-width="1.6" marker-end="url(#arr-m11-pf)"/>
  <path class="ln-hi" d="M492 120 L540 120" stroke-width="1.6" marker-end="url(#arr-m11-pf)"/>
  <!-- loop back -->
  <path class="ln" d="M605 214 L605 238 L115 238 L115 214" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="tag" x="360" y="254" text-anchor="middle">update_min_d 0.25 m 또는 update_min_a 0.2 rad 움직일 때마다 반복 · 파티클 500~3000 (KLD)</text>
</svg>
