<svg viewBox="0 0 720 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="navigate_through_poses는 네 점을 지나는 경로 하나로 멈추지 않고 통과하고, follow_waypoints는 점마다 navigate_to_pose로 도착해 멈추고 대기한 뒤 다음 점으로 이동">
  <defs>
    <marker id="arr-m13-actions" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
    <marker id="arr-m13-actions-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
  </defs>
  <text class="lbl mono" x="180" y="24" text-anchor="middle">navigate_through_poses</text>
  <text class="lbl mono" x="540" y="24" text-anchor="middle">follow_waypoints</text>
  <path class="ln" d="M360 40 L360 250" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- left: smooth path through 4 points (square) -->
  <path class="ln-hi" d="M70 220 L230 220 Q290 220 290 170 L290 110 Q290 70 250 70 L110 70 Q70 70 70 110 L70 150" stroke-width="2.4" marker-end="url(#arr-m13-actions)"/>
  <g class="wr">
    <circle cx="260" cy="220" r="6"/><circle cx="290" cy="80" r="6"/><circle cx="80" cy="70" r="6"/><circle cx="70" cy="160" r="6"/>
  </g>
  <circle cx="70" cy="220" r="8" class="hi"/>
  <text class="sub" x="70" y="244" text-anchor="middle">출발</text>
  <text class="sub" x="180" y="130" text-anchor="middle">경로 하나로 계획</text>
  <text class="sub" x="180" y="148" text-anchor="middle">점에서 멈추지 않음</text>
  <text class="sub" x="180" y="166" text-anchor="middle">지난 점은 BT가 제거</text>
  <!-- right: segmented with stops -->
  <path class="ln-hi" d="M438 220 L612 220" stroke-width="2.4" marker-end="url(#arr-m13-actions)"/>
  <path class="ln-hi" d="M620 212 L620 88" stroke-width="2.4" marker-end="url(#arr-m13-actions)"/>
  <path class="ln-hi" d="M612 80 L448 80" stroke-width="2.4" marker-end="url(#arr-m13-actions)"/>
  <path class="ln-hi" d="M440 88 L440 152" stroke-width="2.4" marker-end="url(#arr-m13-actions)"/>
  <g class="wr">
    <circle cx="620" cy="220" r="7"/><circle cx="620" cy="80" r="7"/><circle cx="440" cy="80" r="7"/><circle cx="440" cy="160" r="7"/>
  </g>
  <circle cx="430" cy="220" r="8" class="hi"/>
  <text class="sub" x="430" y="244" text-anchor="middle">출발</text>
  <text class="tag" x="712" y="244" text-anchor="end">① 도착 판정 0.25 m</text>
  <text class="tag" x="628" y="72">② 대기 200 ms</text>
  <text class="tag" x="380" y="66">③ 다음 goal</text>
  <text class="sub" x="530" y="140" text-anchor="middle">점마다 navigate_to_pose</text>
  <text class="sub" x="530" y="158" text-anchor="middle">도착 → 작업 플러그인 → 다음</text>
  <text class="sub" x="530" y="176" text-anchor="middle">stop_on_failure: false</text>
  <text class="tag" x="360" y="278" text-anchor="middle">RViz: Waypoint 모드 → Start Nav Through Poses / Start Waypoint Following</text>
</svg>
