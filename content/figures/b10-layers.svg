<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Docker 이미지 레이어, 컨테이너 쓰기 레이어, 볼륨과 장치 연결">
  <defs>
    <marker id="arr-b10-layers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <rect class="box-hi" x="150" y="36" width="270" height="40" rx="5" stroke-dasharray="5 3"/>
  <text class="lbl" x="285" y="55" text-anchor="middle">컨테이너 레이어 (쓰기 가능)</text>
  <text class="sub" x="285" y="70" text-anchor="middle">컨테이너를 지우면 함께 삭제</text>
  <rect class="box" x="150" y="84" width="270" height="32" rx="4"/>
  <text class="tag mono" x="162" y="104">4  COPY my_node.py</text>
  <rect class="box" x="150" y="120" width="270" height="32" rx="4"/>
  <text class="tag mono" x="162" y="140">3  RUN pip3 install numpy</text>
  <rect class="box" x="150" y="156" width="270" height="32" rx="4"/>
  <text class="tag mono" x="162" y="176">2  RUN apt-get install …</text>
  <rect class="box" x="150" y="192" width="270" height="32" rx="4"/>
  <text class="tag mono" x="162" y="212">1  FROM ros:humble (바탕)</text>
  <path d="M142 86 L136 86 L136 222 L142 222" style="stroke:var(--text-faint);fill:none" stroke-width="1.4"/>
  <text class="lbl" x="128" y="150" text-anchor="end">이미지</text>
  <text class="sub" x="128" y="167" text-anchor="end">읽기 전용 레이어</text>
  <text class="lbl" x="128" y="61" text-anchor="end">컨테이너</text>
  <rect class="box" x="150" y="238" width="550" height="30" rx="5"/>
  <text class="tag" x="425" y="257" text-anchor="middle">호스트 리눅스 커널 (모든 컨테이너가 공유) · namespace · cgroup · overlay</text>

  <rect class="box" x="480" y="40" width="220" height="62" rx="6"/>
  <text class="lbl" x="590" y="62" text-anchor="middle">볼륨 -v 호스트:컨테이너</text>
  <text class="sub mono" x="590" y="80" text-anchor="middle">~/docker ⇄ ~/share</text>
  <text class="sub" x="590" y="96" text-anchor="middle">컨테이너를 지워도 남음</text>
  <rect class="box" x="480" y="120" width="220" height="62" rx="6"/>
  <text class="lbl" x="590" y="142" text-anchor="middle">장치 --device / -v /dev</text>
  <text class="sub mono" x="590" y="160" text-anchor="middle">/dev/rrc · /dev/ldlidar</text>
  <text class="sub mono" x="590" y="176" text-anchor="middle">/dev/video0</text>
  <path d="M422 56 L478 70" style="stroke:var(--accent);fill:none" stroke-width="1.6" marker-start="url(#arr-b10-layers)" marker-end="url(#arr-b10-layers)"/>
  <path d="M422 62 L478 150" style="stroke:var(--accent);fill:none" stroke-width="1.6" marker-end="url(#arr-b10-layers)"/>
  <text class="tag" x="590" y="210" text-anchor="middle">--network=host : 호스트 네트워크 공유</text>
</svg>
