<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="7단계 실행 프로토콜: 의도 라우팅, 데이터 조회, 지능형 분석, 메모리 조회, 워크플로 실행, 안전 확인과 수동 검토, 피드백 루프. 6단계에서 발송과 삭제는 사람의 확인을 받아야 하고, 7단계의 update_memory가 다음 요청의 4단계 메모리 조회로 되돌아간다">
  <defs>
    <marker id="arr-c07-phases" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
    <marker id="arr-c07-phases-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <!-- boxes: x = 12 + i*100, width 88 -->
  <rect class="box" x="12" y="40" width="88" height="70" rx="7"/>
  <text class="lbl" x="56" y="62" text-anchor="middle">1 의도</text>
  <text class="sub" x="56" y="80" text-anchor="middle">라우팅</text>
  <text class="tag mono" x="56" y="98" text-anchor="middle">intent</text>

  <rect class="box" x="112" y="40" width="88" height="70" rx="7"/>
  <text class="lbl" x="156" y="62" text-anchor="middle">2 조회</text>
  <text class="sub" x="156" y="80" text-anchor="middle">범위 최소화</text>
  <text class="tag mono" x="156" y="98" text-anchor="middle">read_email</text>

  <rect class="box" x="212" y="40" width="88" height="70" rx="7"/>
  <text class="lbl" x="256" y="62" text-anchor="middle">3 분석</text>
  <text class="sub" x="256" y="80" text-anchor="middle">JSON 배열</text>
  <text class="tag mono" x="256" y="98" text-anchor="middle">analyze_…</text>

  <rect class="box" x="312" y="40" width="88" height="70" rx="7"/>
  <text class="lbl" x="356" y="62" text-anchor="middle">4 메모리</text>
  <text class="sub" x="356" y="80" text-anchor="middle">선호 반영</text>
  <text class="tag mono" x="356" y="98" text-anchor="middle">MEMORY.md</text>

  <rect class="box" x="412" y="40" width="88" height="70" rx="7"/>
  <text class="lbl" x="456" y="62" text-anchor="middle">5 워크플로</text>
  <text class="sub" x="456" y="80" text-anchor="middle">max_steps</text>
  <text class="tag mono" x="456" y="98" text-anchor="middle">execute_wf</text>

  <rect class="box-hi" x="512" y="40" width="88" height="70" rx="7"/>
  <text class="lbl" x="556" y="62" text-anchor="middle">6 안전</text>
  <text class="sub" x="556" y="80" text-anchor="middle">확인 카드</text>
  <text class="tag mono" x="556" y="98" text-anchor="middle">approve?</text>

  <rect class="box" x="612" y="40" width="96" height="70" rx="7"/>
  <text class="lbl" x="660" y="62" text-anchor="middle">7 피드백</text>
  <text class="sub" x="660" y="80" text-anchor="middle">선호 저장</text>
  <text class="tag mono" x="660" y="98" text-anchor="middle">update_memory</text>

  <path class="ln" d="M100 75 L110 75" stroke-width="1.4" marker-end="url(#arr-c07-phases)"/>
  <path class="ln" d="M200 75 L210 75" stroke-width="1.4" marker-end="url(#arr-c07-phases)"/>
  <path class="ln" d="M300 75 L310 75" stroke-width="1.4" marker-end="url(#arr-c07-phases)"/>
  <path class="ln" d="M400 75 L410 75" stroke-width="1.4" marker-end="url(#arr-c07-phases)"/>
  <path class="ln" d="M500 75 L510 75" stroke-width="1.4" marker-end="url(#arr-c07-phases)"/>
  <path class="ln" d="M600 75 L610 75" stroke-width="1.4" marker-end="url(#arr-c07-phases)"/>

  <text class="tag" x="12" y="26">요청 1건마다 같은 순서로 — 단계를 건너뛰지 않는다</text>

  <!-- gate branch -->
  <path class="ln-hi" d="M556 110 L556 150" stroke-width="2" marker-end="url(#arr-c07-phases-hi)"/>
  <rect class="box" x="470" y="152" width="172" height="46" rx="7"/>
  <text class="lbl" x="556" y="172" text-anchor="middle">발송 · 삭제 · 외부 전달</text>
  <text class="sub" x="556" y="189" text-anchor="middle">승인 전에는 초안만</text>

  <!-- feedback loop -->
  <path class="ln" d="M660 110 L660 226 L356 226 L356 112" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr-c07-phases)"/>
  <text class="tag" x="370" y="218">다음 요청에서 반영 (분류·말투 교정)</text>

  <!-- guard -->
  <text class="tag" x="12" y="140">조회 범위: 보낸 사람 · 기간 · 라벨로 먼저 좁힘</text>
  <text class="tag" x="12" y="158">분석 결과: enum · 필수 필드 검증 후 다음 단계</text>
  <text class="tag" x="12" y="176">워크플로: max_steps + 멱등 키로 무한 반복 · 중복 발송 방지</text>
</svg>
