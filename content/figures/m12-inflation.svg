<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="팽창 비용 곡선: 장애물 거리 d에 따른 코스트맵 비용. robot_radius 0.05 m까지 253, 그 뒤 cost_scaling_factor 2와 5의 지수 감소 곡선, 원본 설정은 0.05 m에서 바로 0">
  <defs>
    <marker id="arr-m12-inflation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
  </defs>
  <!-- axes: d 0..0.35 -> x 80..460, cost 0..254 -> y 250..40 -->
  <path class="ln" d="M80 250 L476 250" stroke-width="1.4" marker-end="url(#arr-m12-inflation)"/>
  <path class="ln" d="M80 250 L80 26" stroke-width="1.4" marker-end="url(#arr-m12-inflation)"/>
  <text class="sub mono" x="476" y="270" text-anchor="end">d [m]</text>
  <text class="sub" x="88" y="24">비용</text>
  <!-- ticks -->
  <g class="sub mono" text-anchor="middle">
    <text x="80" y="266">0</text><text x="134" y="266">0.05</text><text x="189" y="266">0.10</text>
    <text x="243" y="266">0.15</text><text x="297" y="266">0.20</text><text x="351" y="266">0.25</text><text x="406" y="266">0.30</text>
  </g>
  <g class="sub mono" text-anchor="end">
    <text x="74" y="44">254</text><text x="74" y="150">127</text><text x="74" y="254">0</text>
  </g>
  <path d="M80 145 L460 145" style="stroke:var(--border)" stroke-width="0.8" stroke-dasharray="2 4"/>
  <!-- lethal / inscribed zone -->
  <rect x="80" y="40" width="54" height="210" style="fill:var(--danger);opacity:0.12"/>
  <text class="tag" x="107" y="236" text-anchor="middle">253</text>
  <text class="tag" x="107" y="222" text-anchor="middle">내접</text>
  <path d="M80 40 L134 41" style="stroke:var(--danger)" stroke-width="2.4"/>
  <!-- original config: drop to 0 at 0.05 -->
  <path d="M134 41 L134 250 L460 250" style="stroke:var(--warn)" stroke-width="2.6" stroke-dasharray="6 4"/>
  <!-- curves (inflation_radius 0.3) -->
  <path class="ln-hi" d="M134 42 L148 47 L161 52 L175 57 L189 61 L202 66 L216 71 L229 75 L243 79 L256 84 L270 88 L284 92 L297 96 L311 99 L324 103 L338 107 L351 110 L365 114 L379 117 L392 120 L406 124 L406 250" stroke-width="2.2"/>
  <path d="M134 42 L148 54 L161 66 L175 77 L189 88 L202 98 L216 107 L229 115 L243 124 L256 131 L270 138 L284 145 L297 152 L311 158 L324 163 L338 168 L351 173 L365 178 L379 182 L392 186 L406 190 L406 250" style="fill:none;stroke:var(--text-dim)" stroke-width="2.2"/>
  <!-- legend -->
  <line x1="500" y1="60" x2="530" y2="60" style="stroke:var(--warn)" stroke-width="2.6" stroke-dasharray="6 4"/>
  <text class="lbl" x="538" y="64">원본 설정</text>
  <text class="sub mono" x="538" y="80">radius = inflation = 0.05</text>
  <line x1="500" y1="110" x2="530" y2="110" style="stroke:var(--accent)" stroke-width="2.2"/>
  <text class="lbl" x="538" y="114">scaling 2.0</text>
  <text class="sub mono" x="538" y="130">inflation 0.3 (가정)</text>
  <line x1="500" y1="160" x2="530" y2="160" style="stroke:var(--text-dim)" stroke-width="2.2"/>
  <text class="lbl" x="538" y="164">scaling 5.0</text>
  <text class="sub mono" x="538" y="180">inflation 0.3 (가정)</text>
  <text class="sub" x="500" y="222">cost = 252·exp(−k·(d − r_ins))</text>
  <text class="sub" x="500" y="240">k 클수록 빨리 줄어 → 벽에 더 가까이</text>
</svg>
