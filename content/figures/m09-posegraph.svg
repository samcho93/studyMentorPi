<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="포즈 그래프와 루프 클로저: 최적화 전에는 누적 오차로 고리가 벌어지고, 루프 클로저 제약을 더해 최적화하면 고리가 닫힘">
  <defs>
    <marker id="arr-m09-posegraph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
  </defs>
  <text class="lbl" x="170" y="24" text-anchor="middle">① 최적화 전 (오도메트리 + 연속 매칭)</text>
  <text class="lbl" x="550" y="24" text-anchor="middle">② 루프 클로저 후 최적화</text>
  <!-- left: open loop drifting -->
  <path class="ln" d="M60 230 L140 232 L220 226 L285 190 L300 120 L262 64 L186 50 L112 70 L78 128 L92 190" stroke-width="2"/>
  <g class="hi">
    <circle cx="60" cy="230" r="6"/><circle cx="140" cy="232" r="6"/><circle cx="220" cy="226" r="6"/>
    <circle cx="285" cy="190" r="6"/><circle cx="300" cy="120" r="6"/><circle cx="262" cy="64" r="6"/>
    <circle cx="186" cy="50" r="6"/><circle cx="112" cy="70" r="6"/><circle cx="78" cy="128" r="6"/>
  </g>
  <circle cx="92" cy="190" r="7" class="wr"/>
  <text class="sub mono" x="46" y="252">x₀</text>
  <text class="sub mono" x="102" y="196">xₙ</text>
  <!-- loop closure constraint (dashed) -->
  <path d="M90 197 L64 224" style="stroke:var(--warn)" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="sub" x="120" y="216">누적 오차 → 고리가 안 닫힘</text>
  <text class="tag" x="36" y="206" text-anchor="middle">루프</text>
  <!-- arrow between -->
  <path class="ln" d="M346 150 L394 150" stroke-width="2" marker-end="url(#arr-m09-posegraph)"/>
  <text class="tag" x="370" y="138" text-anchor="middle">Ceres</text>
  <text class="tag" x="370" y="172" text-anchor="middle">LM</text>
  <!-- right: closed loop -->
  <path class="ln-hi" d="M440 230 L520 234 L600 230 L668 196 L680 128 L646 70 L570 56 L494 72 L452 130 L442 196 Z" stroke-width="2"/>
  <g class="hi">
    <circle cx="440" cy="230" r="6"/><circle cx="520" cy="234" r="6"/><circle cx="600" cy="230" r="6"/>
    <circle cx="668" cy="196" r="6"/><circle cx="680" cy="128" r="6"/><circle cx="646" cy="70" r="6"/>
    <circle cx="570" cy="56" r="6"/><circle cx="494" cy="72" r="6"/><circle cx="452" cy="130" r="6"/>
    <circle cx="442" cy="196" r="6"/>
  </g>
  <text class="sub" x="560" y="150" text-anchor="middle">오차를 모든 제약에 나눠 분배</text>
  <!-- legend -->
  <line x1="40" y1="280" x2="72" y2="280" style="stroke:var(--border)" stroke-width="2"/>
  <text class="sub" x="80" y="284">연속 스캔 매칭 제약 (최근 20개, 1.5 m 이내)</text>
  <line x1="390" y1="280" x2="422" y2="280" style="stroke:var(--warn)" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="sub" x="430" y="284">루프 클로저 제약 (3.0 m 이내 후보, 응답 ≥ 0.45)</text>
</svg>
