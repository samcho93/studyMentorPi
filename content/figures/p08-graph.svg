<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="시맨틱 내비게이션 ROS 2 그래프: 깊이 카메라와 yolov5_ros2 검출, TF를 semantic_mapper가 받아 시맨틱 지도를 만들고, command_executor가 자연어 명령을 해석해 Nav2에 목표를 보낸다">
  <defs>
    <marker id="arr-p08-graph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
  </defs>
  <rect class="box" x="10" y="20" width="150" height="62" rx="6"/>
  <text class="lbl" x="85" y="44" text-anchor="middle">깊이 카메라</text>
  <text class="tag mono" x="85" y="62" text-anchor="middle">rgb0 · depth0</text>
  <text class="tag mono" x="85" y="76" text-anchor="middle">camera_info</text>
  <rect class="box" x="200" y="20" width="150" height="62" rx="6"/>
  <text class="lbl" x="275" y="44" text-anchor="middle">yolov5_ros2</text>
  <text class="tag" x="275" y="62" text-anchor="middle">yolov5s (COCO)</text>
  <text class="tag" x="275" y="76" text-anchor="middle">메시지당 물체 1개</text>
  <path class="ln" d="M160 40 L198 40" marker-end="url(#arr-p08-graph)"/>
  <text class="tag mono" x="179" y="33" text-anchor="middle">rgb0</text>
  <rect class="box-hi" x="400" y="20" width="170" height="80" rx="8"/>
  <text class="lbl" x="485" y="44" text-anchor="middle">semantic_mapper</text>
  <text class="tag" x="485" y="62" text-anchor="middle">역투영 → TF → map</text>
  <text class="tag" x="485" y="78" text-anchor="middle">게이팅 · 누적 평균 · 횟수</text>
  <text class="tag" x="485" y="94" text-anchor="middle">색: bbox 안 HSV</text>
  <path class="ln" d="M350 45 L398 45" marker-end="url(#arr-p08-graph)"/>
  <text class="tag mono" x="374" y="38" text-anchor="middle">object_detect</text>
  <path class="ln" d="M85 82 L85 118 L380 118 L380 90 L398 90" marker-end="url(#arr-p08-graph)"/>
  <text class="tag" x="230" y="112" text-anchor="middle">depth0 영상 · K 행렬</text>
  <rect class="box" x="610" y="20" width="100" height="80" rx="6"/>
  <text class="lbl" x="660" y="48" text-anchor="middle">지도 JSON</text>
  <text class="tag mono" x="660" y="66" text-anchor="middle">semantic_</text>
  <text class="tag mono" x="660" y="80" text-anchor="middle">map.json</text>
  <path class="ln" d="M570 60 L608 60" marker-end="url(#arr-p08-graph)"/>
  <rect class="box" x="10" y="150" width="150" height="62" rx="6"/>
  <text class="lbl" x="85" y="174" text-anchor="middle">TF 트리</text>
  <text class="tag mono" x="85" y="192" text-anchor="middle">map→odom (AMCL)</text>
  <text class="tag mono" x="85" y="206" text-anchor="middle">→ ascamera_color_0</text>
  <path class="ln" d="M160 165 L460 165 L460 102" marker-end="url(#arr-p08-graph)"/>
  <rect class="box" x="200" y="230" width="150" height="54" rx="6"/>
  <text class="lbl" x="275" y="253" text-anchor="middle">명령 입력</text>
  <text class="tag mono" x="275" y="271" text-anchor="middle">/nl_command</text>
  <rect class="box-hi" x="400" y="190" width="170" height="94" rx="8"/>
  <text class="lbl" x="485" y="212" text-anchor="middle">command_executor</text>
  <text class="tag" x="485" y="230" text-anchor="middle">파싱 → 슬롯 (LLM 선택)</text>
  <text class="tag" x="485" y="246" text-anchor="middle">그라운딩 → 목표 자세</text>
  <text class="tag" x="485" y="262" text-anchor="middle">검증 · 탐색 상태 기계</text>
  <text class="tag mono" x="485" y="277" text-anchor="middle">/nl_status</text>
  <path class="ln" d="M350 257 L398 257" marker-end="url(#arr-p08-graph)"/>
  <path class="ln" d="M660 100 L660 140 L540 140 L540 188" marker-end="url(#arr-p08-graph)"/>
  <text class="tag" x="600" y="133" text-anchor="middle">지도 읽기</text>
  <rect class="box" x="610" y="200" width="100" height="74" rx="6"/>
  <text class="lbl" x="660" y="226" text-anchor="middle">Nav2</text>
  <text class="tag mono" x="660" y="244" text-anchor="middle">navigate_</text>
  <text class="tag mono" x="660" y="258" text-anchor="middle">to_pose</text>
  <path class="ln-hi" d="M570 225 L608 225" marker-end="url(#arr-p08-graph)"/>
  <path class="ln" d="M608 255 L572 255" marker-end="url(#arr-p08-graph)"/>
  <text class="tag" x="590" y="272" text-anchor="middle">결과</text>
</svg>
