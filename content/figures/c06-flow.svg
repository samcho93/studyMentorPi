<svg viewBox="0 0 720 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telegram 메시지가 Bot API 서버와 롱 폴링을 거쳐 Gateway, 접근 제어, 세션, 에이전트로 전달되고 답장이 돌아가는 흐름">
  <defs>
    <marker id="arr-c06-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
  </defs>
  <rect class="box" x="10" y="50" width="120" height="80" rx="6"/>
  <text class="lbl" x="70" y="80" text-anchor="middle">Telegram 앱</text>
  <text class="tag" x="70" y="102" text-anchor="middle">사용자 DM·그룹</text>

  <rect class="box" x="165" y="50" width="140" height="80" rx="6"/>
  <text class="lbl" x="235" y="80" text-anchor="middle">Bot API 서버</text>
  <text class="tag" x="235" y="102" text-anchor="middle">업데이트 보관</text>

  <rect class="box-hi" x="360" y="20" width="350" height="140" rx="6"/>
  <text class="lbl" x="535" y="42" text-anchor="middle">OpenClaw Gateway (로봇/PC 안)</text>
  <rect class="box" x="375" y="55" width="100" height="90" rx="6"/>
  <text class="lbl" x="425" y="80" text-anchor="middle">접근 제어</text>
  <text class="tag" x="425" y="102" text-anchor="middle">pairing</text>
  <text class="tag" x="425" y="120" text-anchor="middle">allowFrom</text>
  <rect class="box" x="490" y="55" width="100" height="90" rx="6"/>
  <text class="lbl" x="540" y="80" text-anchor="middle">세션 키</text>
  <text class="tag" x="540" y="102" text-anchor="middle">dmScope</text>
  <text class="tag" x="540" y="120" text-anchor="middle">채널+사람</text>
  <rect class="box" x="605" y="55" width="95" height="90" rx="6"/>
  <text class="lbl" x="652" y="80" text-anchor="middle">Agent</text>
  <text class="tag" x="652" y="102" text-anchor="middle">skills</text>
  <text class="tag" x="652" y="120" text-anchor="middle">tools</text>
  <path class="ln" d="M475 100 L488 100" marker-end="url(#arr-c06-flow)"/>
  <path class="ln" d="M590 100 L603 100" marker-end="url(#arr-c06-flow)"/>

  <path class="ln" d="M130 80 L163 80" marker-end="url(#arr-c06-flow)"/>
  <path class="ln-hi" d="M358 80 L307 80" marker-end="url(#arr-c06-flow)"/>
  <text class="tag" x="332" y="72" text-anchor="middle">getUpdates</text>
  <path class="ln-hi" d="M307 105 L373 105" marker-end="url(#arr-c06-flow)"/>
  <text class="tag" x="332" y="122" text-anchor="middle">update</text>

  <path class="ln" d="M652 145 L652 200 L235 200 L235 132" marker-end="url(#arr-c06-flow)"/>
  <text class="tag" x="445" y="194" text-anchor="middle">sendMessage (답장)</text>
  <path class="ln" d="M165 110 L132 110" marker-end="url(#arr-c06-flow)"/>

  <text class="sub" x="10" y="240">롱 폴링: Gateway가 먼저 묻는다(바깥으로 나가는 연결) → 공인 IP·포트 개방 불필요</text>
  <text class="sub" x="10" y="258">웹훅: Bot API 서버가 HTTPS로 밀어 준다 → 외부에서 접근 가능한 주소 필요</text>
