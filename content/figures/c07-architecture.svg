<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="스마트 이메일 에이전트 구조: Telegram 사용자가 보낸 메시지를 OpenClaw Gateway가 main 에이전트로 보내고, main 에이전트는 telegram-mail-orchestrator 스킬의 SKILL.md, 워크플로, 확인 카드 템플릿, 계정 설정과 MEMORY.md를 참고해 메일 워커를 통해 Gmail IMAP 993과 SMTP 465에 접근한다">
  <defs>
    <marker id="arr-c07-architecture" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
    <marker id="arr-c07-architecture-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>

  <!-- Telegram -->
  <rect class="box" x="16" y="40" width="130" height="64" rx="8"/>
  <text class="lbl" x="81" y="66" text-anchor="middle">Telegram</text>
  <text class="sub" x="81" y="86" text-anchor="middle">사용자 · 봇 채팅</text>

  <!-- Gateway -->
  <rect class="box" x="196" y="40" width="130" height="64" rx="8"/>
  <text class="lbl" x="261" y="66" text-anchor="middle">Gateway</text>
  <text class="sub mono" x="261" y="86" text-anchor="middle">:18789 loopback</text>

  <!-- agent -->
  <rect class="box-hi" x="376" y="40" width="150" height="64" rx="8"/>
  <text class="lbl" x="451" y="66" text-anchor="middle">main 에이전트</text>
  <text class="sub" x="451" y="86" text-anchor="middle">LLM + 7단계 프로토콜</text>

  <path class="ln-hi" d="M146 64 L194 64" stroke-width="2" marker-end="url(#arr-c07-architecture-hi)"/>
  <path class="ln-hi" d="M326 64 L374 64" stroke-width="2" marker-end="url(#arr-c07-architecture-hi)"/>
  <path class="ln" d="M374 84 L328 84" stroke-width="1.4" marker-end="url(#arr-c07-architecture)"/>
  <path class="ln" d="M194 84 L148 84" stroke-width="1.4" marker-end="url(#arr-c07-architecture)"/>
  <text class="tag" x="171" y="120" text-anchor="middle">메시지 · 확인 카드</text>

  <!-- workspace -->
  <rect class="box" x="196" y="146" width="330" height="178" rx="8" style="fill:none"/>
  <text class="tag mono" x="206" y="164">workspace/main/</text>
  <rect class="box" x="210" y="174" width="302" height="104" rx="6"/>
  <text class="lbl mono" x="222" y="194">skills/telegram-mail-orchestrator/</text>
  <text class="sub mono" x="232" y="214">SKILL.md — 규칙 · 트리거 · 출력 형식</text>
  <text class="sub mono" x="232" y="231">workflows/default-workflows.json</text>
  <text class="sub mono" x="232" y="248">templates/interactive-confirm-card.json</text>
  <text class="sub mono" x="232" y="265">config/email-accounts.json (비밀)</text>
  <rect class="box" x="210" y="286" width="302" height="30" rx="6"/>
  <text class="lbl mono" x="222" y="306">MEMORY.md — 장기 선호</text>
  <path class="ln" d="M451 104 L451 144" stroke-width="1.4" marker-end="url(#arr-c07-architecture)"/>
  <text class="tag" x="458" y="130">읽기 · update_memory</text>

  <!-- mail worker -->
  <rect class="box" x="566" y="40" width="124" height="64" rx="8"/>
  <text class="lbl" x="628" y="66" text-anchor="middle">메일 워커</text>
  <text class="sub" x="628" y="86" text-anchor="middle">스크립트 · exec</text>
  <path class="ln-hi" d="M526 72 L564 72" stroke-width="2" marker-end="url(#arr-c07-architecture-hi)"/>

  <rect class="box" x="566" y="160" width="124" height="54" rx="8"/>
  <text class="lbl" x="628" y="182" text-anchor="middle">Gmail IMAP</text>
  <text class="sub mono" x="628" y="200" text-anchor="middle" style="font-size:10.5px">imap.gmail.com:993</text>
  <rect class="box" x="566" y="240" width="124" height="54" rx="8"/>
  <text class="lbl" x="628" y="262" text-anchor="middle">Gmail SMTP</text>
  <text class="sub mono" x="628" y="280" text-anchor="middle" style="font-size:10.5px">smtp.gmail.com:465</text>
  <path class="ln" d="M628 104 L628 158" stroke-width="1.4" marker-end="url(#arr-c07-architecture)"/>
  <text class="tag" x="622" y="136" text-anchor="end">읽기</text>
  <path class="ln" d="M690 88 L710 88 L710 267 L692 267" stroke-width="1.4" stroke-dasharray="5 4" style="fill:none" marker-end="url(#arr-c07-architecture)"/>
  <text class="tag" x="628" y="231" text-anchor="middle">확인 후 발송만</text>
  <text class="tag" x="628" y="314" text-anchor="middle">TLS · 앱 비밀번호</text>

  <text class="tag" x="16" y="160">점선 = 사람의 확인을</text>
  <text class="tag" x="16" y="176">거쳐야만 열리는 경로</text>
</svg>
