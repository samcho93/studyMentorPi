<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="역센서 모델: 라이다 빔이 지나간 셀은 비어 있음 쪽으로, 끝 셀은 점유 쪽으로 로그 오즈를 갱신하고 그 너머는 정보가 없음">
  <defs>
    <marker id="arr-m09-raycast" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <!-- grid 12 x 5 cells of 40px starting x=60,y=40 -->
  <g class="ln" stroke-width="1">
    <path d="M60 40 L540 40 M60 80 L540 80 M60 120 L540 120 M60 160 L540 160 M60 200 L540 200 M60 240 L540 240"/>
    <path d="M60 40 L60 240 M100 40 L100 240 M140 40 L140 240 M180 40 L180 240 M220 40 L220 240 M260 40 L260 240 M300 40 L300 240 M340 40 L340 240 M380 40 L380 240 M420 40 L420 240 M460 40 L460 240 M500 40 L500 240 M540 40 L540 240"/>
  </g>
  <!-- free cells along the ray (row 3: y 120-160) -->
  <g style="fill:var(--ok);opacity:0.28">
    <rect x="100" y="120" width="40" height="40"/><rect x="140" y="120" width="40" height="40"/>
    <rect x="180" y="120" width="40" height="40"/><rect x="220" y="120" width="40" height="40"/>
    <rect x="260" y="120" width="40" height="40"/><rect x="300" y="120" width="40" height="40"/>
  </g>
  <!-- hit cell -->
  <rect x="340" y="120" width="40" height="40" style="fill:var(--danger);opacity:0.55"/>
  <!-- unknown beyond -->
  <g style="fill:var(--text-faint);opacity:0.18">
    <rect x="380" y="120" width="40" height="40"/><rect x="420" y="120" width="40" height="40"/>
    <rect x="460" y="120" width="40" height="40"/><rect x="500" y="120" width="40" height="40"/>
  </g>
  <!-- wall -->
  <path d="M362 44 L362 236" style="stroke:var(--text)" stroke-width="4"/>
  <text class="tag" x="370" y="58">실제 벽</text>
  <!-- robot and beam -->
  <circle cx="80" cy="140" r="13" class="hi"/>
  <text class="tag" x="80" y="182" text-anchor="middle">로봇</text>
  <path class="ln-hi" d="M94 140 L356 140" stroke-width="2.4" marker-end="url(#arr-m09-raycast)"/>
  <text class="sub mono" x="220" y="112" text-anchor="middle">빔 거리 r</text>
  <!-- legend -->
  <rect x="566" y="54" width="18" height="18" style="fill:var(--ok);opacity:0.4"/>
  <text class="lbl" x="592" y="68">지나간 셀</text>
  <text class="sub mono" x="592" y="86">l += l_free (−0.4)</text>
  <rect x="566" y="110" width="18" height="18" style="fill:var(--danger);opacity:0.6"/>
  <text class="lbl" x="592" y="124">끝 셀</text>
  <text class="sub mono" x="592" y="142">l += l_occ (+0.85)</text>
  <rect x="566" y="166" width="18" height="18" style="fill:var(--text-faint);opacity:0.3"/>
  <text class="lbl" x="592" y="180">너머 (가려짐)</text>
  <text class="sub mono" x="592" y="198">변화 없음</text>
  <text class="sub" x="360" y="268" text-anchor="middle">p = 1 − 1/(1 + e^l) · l = 0 ↔ p = 0.5(모름) · 반복 관측이 쌓일수록 |l| 증가 (±5에서 포화)</text>
</svg>
