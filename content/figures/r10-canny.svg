<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Canny 4단계와 이력 임계값 그래프">
  <defs>
    <marker id="arr-r10-canny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
  </defs>
  <rect class="box" x="10" y="20" width="160" height="56" rx="6"/>
  <text class="lbl" x="90" y="44" text-anchor="middle">① 가우시안 5×5</text>
  <text class="sub" x="90" y="64" text-anchor="middle">잡음 제거</text>
  <rect class="box" x="190" y="20" width="160" height="56" rx="6"/>
  <text class="lbl" x="270" y="44" text-anchor="middle">② Sobel G, θ</text>
  <text class="sub" x="270" y="64" text-anchor="middle">크기와 방향(4방향)</text>
  <rect class="box" x="370" y="20" width="160" height="56" rx="6"/>
  <text class="lbl" x="450" y="44" text-anchor="middle">③ 비최대 억제</text>
  <text class="sub" x="450" y="64" text-anchor="middle">1픽셀 폭으로 얇게</text>
  <rect class="box-hi" x="550" y="20" width="160" height="56" rx="6"/>
  <text class="lbl" x="630" y="44" text-anchor="middle">④ 이력 임계값</text>
  <text class="sub" x="630" y="64" text-anchor="middle">minVal · maxVal</text>
  <path class="ln" d="M170 48 L186 48 M350 48 L366 48 M530 48 L546 48" stroke-width="1.6" marker-end="url(#arr-r10-canny)"/>
  <path class="ln" d="M80 270 L80 110" stroke-width="1.4" marker-end="url(#arr-r10-canny)"/>
  <text class="tag" x="86" y="118">기울기 G</text>
  <path class="ln" d="M80 270 L520 270" stroke-width="1.4" marker-end="url(#arr-r10-canny)"/>
  <text class="tag" x="480" y="288">엣지를 따라간 위치</text>
  <path class="ln-hi" d="M80 160 L520 160" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="tag mono" x="526" y="164">maxVal</text>
  <path class="ln-hi" d="M80 220 L520 220" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="tag mono" x="526" y="224">minVal</text>
  <path class="ln" d="M90 250 Q130 130 170 140 Q210 150 240 195 Q270 235 300 200 Q330 170 360 205 Q390 240 420 250 Q450 256 500 240" stroke-width="2.2" fill="none"/>
  <text class="sub" x="150" y="128" text-anchor="middle">확실한 엣지</text>
  <text class="sub" x="300" y="190" text-anchor="middle">연결되어 유지</text>
  <text class="sub" x="440" y="236" text-anchor="middle">버림</text>
  <text class="sub" x="620" y="130" text-anchor="middle">G &gt; maxVal : 엣지</text>
  <text class="sub" x="620" y="150" text-anchor="middle">minVal ~ maxVal :</text>
  <text class="sub" x="620" y="168" text-anchor="middle">엣지와 이어지면 유지</text>
  <text class="sub" x="620" y="188" text-anchor="middle">G &lt; minVal : 제거</text>
</svg>
