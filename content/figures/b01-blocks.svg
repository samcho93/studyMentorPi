  <text class="sub" x="330" y="82" text-anchor="middle">Cortex-A76 ×4, 2.4 GHz</text>
  <text class="tag" x="250" y="112">· Linux + Docker 컨테이너</text>
  <text class="tag" x="250" y="136">· ROS 2 Humble 노드</text>
  <text class="tag" x="250" y="160">· SLAM · 내비게이션</text>
  <text class="tag" x="250" y="184">· 영상 인식 · 앱 서버</text>
  <text class="tag mono" x="250" y="208">· cmd_vel → 바퀴 rps</text>
  <text class="tag mono" x="250" y="232">· ros_robot_controller</text>
  <path class="ln-hi" d="M432 150 L492 150" stroke-width="2.2" marker-start="url(#arr-b01-blocks-hi)" marker-end="url(#arr-b01-blocks-hi)"/>
  <text class="tag mono" x="462" y="138" text-anchor="middle">UART</text>
  <text class="tag mono" x="462" y="170" text-anchor="middle">1 Mbps</text>
