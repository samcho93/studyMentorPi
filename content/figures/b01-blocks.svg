  <text class="sub mono" x="91" y="135" text-anchor="middle">USB · RGB+Depth</text>
  <rect class="box" x="16" y="160" width="150" height="44" rx="6"/>
  <text class="lbl" x="91" y="178" text-anchor="middle">조이패드 수신기</text>
  <text class="sub mono" x="91" y="195" text-anchor="middle">USB · /joy</text>
  <rect class="box" x="16" y="220" width="150" height="44" rx="6"/>
  <text class="lbl" x="91" y="238" text-anchor="middle">WonderPi 앱</text>
  <text class="sub" x="91" y="255" text-anchor="middle">Wi-Fi</text>
  <path class="ln" d="M166 62 L228 100" stroke-width="1.6" style="stroke:var(--text-faint)" marker-end="url(#arr-b01-blocks)"/>
  <path class="ln" d="M166 122 L228 130" stroke-width="1.6" style="stroke:var(--text-faint)" marker-end="url(#arr-b01-blocks)"/>
  <path class="ln" d="M166 182 L228 170" stroke-width="1.6" style="stroke:var(--text-faint)" marker-end="url(#arr-b01-blocks)"/>
  <path class="ln" d="M166 242 L228 205" stroke-width="1.6" style="stroke:var(--text-faint)" marker-end="url(#arr-b01-blocks)"/>
