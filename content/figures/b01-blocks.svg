<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MentorPi 2단 제어 구조: 센서와 라즈베리파이 5, UART로 연결된 RRC Lite STM32, 모터와 서보">
  <defs>
    <marker id="arr-b01-blocks" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
    <marker id="arr-b01-blocks-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <text class="tag" x="91" y="26" text-anchor="middle">센서 · 입력</text>
  <rect class="box" x="16" y="40" width="150" height="44" rx="6"/>
  <text class="lbl" x="91" y="58" text-anchor="middle">라이다 LD19</text>
  <text class="sub mono" x="91" y="75" text-anchor="middle">USB · /scan</text>
  <rect class="box" x="16" y="100" width="150" height="44" rx="6"/>
