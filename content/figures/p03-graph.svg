<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="미니 시티 챌린지 노드와 토픽 구성: 카메라와 라이다, YOLOv5가 팀 노드 city_fsm으로 들어가고, city_fsm만 속도 명령을 발행한다">
  <defs>
    <marker id="arr-p03-graph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
    <marker id="arr-p03-graph-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <!-- sensors -->
  <rect class="box" x="10" y="30" width="160" height="54" rx="6"/>
  <text class="lbl" x="90" y="53" text-anchor="middle">ascamera (RGB)</text>
  <text class="tag mono" x="90" y="71" text-anchor="middle">depth_camera.launch.py</text>
  <rect class="box" x="10" y="216" width="160" height="54" rx="6"/>
  <text class="lbl" x="90" y="239" text-anchor="middle">LD19 라이다</text>
  <text class="tag mono" x="90" y="257" text-anchor="middle">lidar.launch.py</text>
  <!-- yolo -->
  <rect class="box" x="250" y="20" width="170" height="54" rx="6"/>
  <text class="lbl mono" x="335" y="43" text-anchor="middle">yolov5_ros2</text>
  <text class="tag mono" x="335" y="61" text-anchor="middle">traffic_signs_640s_7_0</text>
  <!-- team node -->
  <rect class="box-hi" x="250" y="128" width="170" height="84" rx="8"/>
  <text class="lbl mono" x="335" y="150" text-anchor="middle">city_fsm (팀 노드)</text>
  <text class="tag" x="335" y="168" text-anchor="middle">차선 오차 · 사건 디바운싱</text>
  <text class="tag" x="335" y="184" text-anchor="middle">FSM · 상태별 속도</text>
  <text class="tag" x="335" y="200" text-anchor="middle">안전 감시(라이다·타임아웃)</text>
