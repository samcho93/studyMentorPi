  <!-- edges -->
  <path class="ln" d="M170 50 L248 47" marker-end="url(#arr-p03-graph)"/>
  <text class="tag mono" x="209" y="40" text-anchor="middle">rgb0/image</text>
  <path class="ln" d="M150 84 L260 126" marker-end="url(#arr-p03-graph)"/>
  <text class="tag mono" x="176" y="116" text-anchor="middle">rgb0/image</text>
  <path class="ln" d="M335 74 L335 126" marker-end="url(#arr-p03-graph)"/>
  <text class="tag mono" x="342" y="104">/yolov5_ros2/object_detect</text>
