  <text class="tag" x="20" y="232">점-점 잔차: ‖p′ − q‖ (대응 점까지)</text>
  <text class="tag" x="20" y="250">점-선 잔차: n·(p′ − q) (벽 법선 방향 성분만)</text>
  <text class="sub" x="20" y="272">점-선은 벽을 따라 미끄러지는 방향을 벌하지 않아</text>
  <text class="sub" x="20" y="288">성긴 스캔에서도 편향이 적고 3~6회에 수렴합니다</text>
  <text class="tag" x="330" y="22">ICP 반복</text>
  <text class="lbl" x="330" y="50" xml:space="preserve">⓪ 초기값 T₀ (직전 이동 = 등속 가정)</text>
  <text class="lbl" x="330" y="80" xml:space="preserve">① 변환: p′ = R(θ)·p + t</text>
  <text class="lbl" x="330" y="110" xml:space="preserve">② 대응: 최근접 이웃 q (전수 / k-d 트리)</text>
  <text class="lbl" x="330" y="140" xml:space="preserve">③ 이상치: d > max(τ, 3·중앙값) 버림</text>
  <text class="lbl" x="330" y="170" xml:space="preserve">④ 갱신: 점-점 → SVD(Kabsch)</text>
  <text class="lbl" x="330" y="200" xml:space="preserve">          점-선 → 가우스-뉴턴 (JᵀJ)Δ = −Jᵀr</text>
  <text class="lbl" x="330" y="230" xml:space="preserve">⑤ |Δt|, |Δθ| < ε 이면 끝, 아니면 ①</text>
  <text class="lbl hi" x="330" y="260" xml:space="preserve">출력: T, H = JᵀJ → 공분산 σ²H⁻¹, 퇴화 검사</text>
  <path d="M322 226 L312 226 L312 76 L322 76" class="ln" style="stroke-dasharray:4 3"/>
</svg>
