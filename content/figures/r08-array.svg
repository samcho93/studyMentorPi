<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="이미지 좌표계와 배열 인덱스: 원점은 왼쪽 위, x는 오른쪽, y는 아래, img[y, x]">
  <defs>
    <marker id="arr-r08-array" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <g>
    <rect class="box" x="60" y="60" width="240" height="180"/>
    <path class="ln" d="M60 90 H300 M60 120 H300 M60 150 H300 M60 180 H300 M60 210 H300" stroke-width="0.6"/>
    <path class="ln" d="M90 60 V240 M120 60 V240 M150 60 V240 M180 60 V240 M210 60 V240 M240 60 V240 M270 60 V240" stroke-width="0.6"/>
    <rect class="hi" x="180" y="120" width="30" height="30"/>
    <path class="ln-hi" d="M60 40 L320 40" stroke-width="2" marker-end="url(#arr-r08-array)"/>
    <text class="lbl" x="326" y="45">x (열, col)</text>
    <path class="ln-hi" d="M40 60 L40 262" stroke-width="2" marker-end="url(#arr-r08-array)"/>
    <text class="lbl" x="40" y="282" text-anchor="middle">y (행, row)</text>
    <text class="tag mono" x="60" y="54" text-anchor="middle">(0,0)</text>
    <text class="tag mono" x="195" y="170" text-anchor="middle">x=4, y=2</text>
  </g>
  <text class="lbl mono" x="400" y="90">img[2, 4]      → [B, G, R]</text>
  <text class="lbl mono" x="400" y="116">img[2, 4, 2]   → R 값 하나</text>
  <text class="lbl mono" x="400" y="142">img[1:3, 2:5]  → ROI (뷰)</text>
  <text class="lbl mono" x="400" y="168">cv2.circle(img, (4, 2), …)</text>
  <text class="sub" x="400" y="198">배열 인덱스: [행 y, 열 x, 채널]</text>
  <text class="sub" x="400" y="218">그리기 함수 좌표: (x, y)</text>
  <text class="sub" x="400" y="238">img.shape = (H, W, 3), dtype uint8 (0~255)</text>
</svg>
