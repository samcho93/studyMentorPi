<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="마스터-슬레이브 군집 제어 네트워크와 토픽 흐름">
  <defs>
    <marker id="arr-a12-network" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--text-faint)"/></marker>
    <marker id="arr-a12-network-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <!-- master -->
  <rect class="box-hi" x="20" y="30" width="330" height="240" rx="8" opacity="0.35"/>
  <text class="lbl" x="35" y="52">마스터 로봇 · HOST = MASTER = robot_1</text>
  <text class="tag" x="35" y="70">Wi-Fi 핫스팟 (예: HW-123)</text>

  <rect class="box" x="35" y="90" width="110" height="46" rx="6"/>
  <text class="lbl" x="90" y="110" text-anchor="middle">joy_node</text>
  <text class="tag" x="90" y="126" text-anchor="middle">USB 수신기</text>
  <path class="ln" d="M145 113 L178 113" marker-end="url(#arr-a12-network)"/>
  <text class="tag mono" x="161" y="105" text-anchor="middle">/joy</text>

  <rect class="box" x="180" y="90" width="160" height="46" rx="6"/>
  <text class="sub mono" x="260" y="110" text-anchor="middle">joystick_control_multi</text>
  <text class="tag" x="260" y="126" text-anchor="middle">같은 Twist를 N대에 복제</text>

  <rect class="box" x="120" y="190" width="220" height="60" rx="6"/>
  <text class="lbl" x="230" y="212" text-anchor="middle">/robot_1 네임스페이스</text>
  <text class="sub mono" x="230" y="232" text-anchor="middle">controller → 모터</text>
  <path class="ln-hi" d="M240 136 L240 188" marker-end="url(#arr-a12-network-hi)"/>
  <text class="tag mono" x="234" y="166" text-anchor="end">/robot_1/controller/cmd_vel</text>

  <!-- wifi -->
  <path class="ln" d="M350 150 L420 150" stroke-dasharray="5 4"/>
  <text class="tag" x="385" y="142" text-anchor="middle">Wi-Fi</text>
  <text class="tag" x="385" y="168" text-anchor="middle">DDS</text>

  <!-- slave -->
  <rect class="box" x="420" y="30" width="280" height="240" rx="8"/>
  <text class="lbl" x="435" y="52">슬레이브 로봇 · HOST = robot_2</text>
  <text class="tag" x="435" y="70">wifi_conf.py 모드 2 (LAN), MASTER = robot_1</text>
  <rect class="box" x="450" y="190" width="220" height="60" rx="6"/>
  <text class="lbl" x="560" y="212" text-anchor="middle">/robot_2 네임스페이스</text>
  <text class="sub mono" x="560" y="232" text-anchor="middle">controller → 모터</text>
  <path class="ln-hi" d="M340 113 L560 113 L560 188" fill="none" marker-end="url(#arr-a12-network-hi)"/>
  <text class="tag mono" x="566" y="150">/robot_2/controller/cmd_vel</text>
  <text class="sub" x="360" y="292" text-anchor="middle">두 로봇 모두 ros2 launch multi multi_controller.launch.py — 조이패드 부분은 HOST == MASTER 일 때만</text>
</svg>
