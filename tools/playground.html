<style>
  html, body { height: 100%; }
  .pg { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  .pg-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .pg-left { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
  .pg-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px; background: var(--bg-elev); border-bottom: 1px solid var(--border); }
  .pg-bar select { font: inherit; font-size: 12.5px; padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); color: var(--text); max-width: 260px; }
  .pg-editor { flex: 1.3; min-height: 0; overflow: auto; background: #282c34; }
  .pg-editor .cm-editor { height: 100%; font-size: 13.5px; }
  .pg-editor .cm-scroller { font-family: var(--mono); }
  .pg-textarea { width: 100%; height: 100%; border: 0; resize: none; padding: 12px; font: 13.5px/1.5 var(--mono); background: #282c34; color: #e6e6e6; }
  .pg-outhead { display: flex; align-items: center; gap: 8px; padding: 5px 12px; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--text-faint); background: var(--bg-elev); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border-soft); }
  .pg-outhead button { margin-left: auto; }
  .pg-out { flex: 1; min-height: 90px; overflow: auto; padding: 8px 12px; font: 12.5px/1.5 var(--mono); background: #0f1419; color: #d7dde8; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ln-err { color: #fca5a5; } .ln-info { color: #7dd3fc; } .ln-ok { color: #86efac; }
  .pg-right { display: flex; flex-direction: column; min-height: 0; background: var(--bg-elev); }
  .pg-tabs { display: flex; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--bg-elev); }
  .pg-tabs button { font: inherit; font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text-dim); cursor: pointer; }
  .pg-tabs button[aria-selected="true"] { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .pg-tabs .badge { font-size: 10.5px; margin-left: 4px; opacity: .8; }
  .pg-pane { flex: 1; min-height: 0; position: relative; display: none; }
  .pg-pane.on { display: flex; flex-direction: column; }
  #world { flex: 1; width: 100%; min-height: 0; display: block; }
  .pg-legend { position: absolute; left: 10px; top: 8px; font-size: 11.5px; color: var(--text-faint); background: var(--overlay); border-radius: 8px; padding: 4px 8px; line-height: 1.6; }
  .pg-legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  .pg-play { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg-elev); border-top: 1px solid var(--border); font-size: 12.5px; }
  .pg-play-t { font-family: var(--mono); color: var(--accent); white-space: nowrap; min-width: 118px; }
  .pg-play input[type=range] { flex: 1; accent-color: var(--accent); }
  .pg-play label { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; color: var(--text-faint); }
  .pg-imgs { flex: 1; overflow: auto; padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; align-content: start; }
  .pg-imgs figure { margin: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--bg); }
  .pg-imgs img { display: block; width: 100%; image-rendering: pixelated; }
  .pg-imgs figcaption { font: 12px var(--mono); padding: 4px 8px; color: var(--text-dim); border-top: 1px solid var(--border-soft); }
  #chart { flex: 1; width: 100%; min-height: 0; display: block; }
  .pg-empty { margin: auto; padding: 24px; text-align: center; color: var(--text-faint); font-size: 13.5px; line-height: 1.7; }
  .pg-summary { padding: 8px 12px; background: var(--bg-elev); border-top: 1px solid var(--border); font-size: 12.5px; min-height: 40px; }
  .pg-summary code { font-size: 12px; }
  .pg-status { font-size: 12px; color: var(--text-faint); margin-left: auto; }
  .pg-status.ok { color: var(--accent); } .pg-status.bad { color: var(--danger); }
  .tool-nav { display: flex; flex-wrap: wrap; gap: 6px; }
  .tool-nav a[aria-current="page"] { color: var(--accent); border-color: var(--accent-dim); }
  @media (max-width: 900px) {
    .pg { height: auto; overflow: auto; }
    .pg-main { display: flex; flex-direction: column; }
    .pg-left { border-right: 0; }
    .pg-editor { min-height: 320px; }
    .pg-right { min-height: 70vh; }
    .sim-top { flex-wrap: wrap; }
    .sim-top-actions { margin-left: 0; flex-wrap: wrap; }
  }
</style>
</head>
<body class="pg">
<header class="sim-top">
  <a class="sim-back" href="../index.html">&larr; 강의</a>
  <div class="sim-title"><strong>ROS 2 Playground</strong><span id="pyInfo">Pyodide 준비 중…</span></div>
  <div class="sim-top-actions">
    <nav class="tool-nav" aria-label="도구">
      <a class="sim-back" href="../sim3d/index.html">3D 시뮬레이터</a>
      <a class="sim-back" href="../sim/index.html">2D 시뮬레이터</a>
      <a class="sim-back" href="playground.html" aria-current="page">Playground</a>
      <a class="sim-back" href="kinematics-lab.html">기구학 실험실</a>
      <a class="sim-back" href="color-lab.html">HSV 색 실험실</a>
      <a class="sim-back" href="urdf-viewer.html">URDF 뷰어</a>
    </nav>
    <button class="theme-btn" type="button" data-theme-toggle aria-label="테마 전환">테마</button>
  </div>
</header>

<main class="pg-main">
  <section class="pg-left">
    <div class="pg-bar">
      <button class="s-btn primary" id="btnRun" type="button" disabled title="Ctrl+Enter">&#9654; 실행</button>
      <button class="s-btn" id="btnStop" type="button" disabled>&#9632; 정지</button>
      <select id="examples" aria-label="예제"><option value="">예제 불러오기…</option></select>
      <button class="s-btn" id="btnShare" type="button" title="코드를 담은 링크 복사">링크 복사</button>
      <button class="s-btn" id="btnDownload" type="button" title="main.py로 저장 — 실물 MentorPi 컨테이너에서 sim 두 줄을 지우고 실행">.py 저장</button>
      <span class="pg-status" id="pyStatus">준비 중…</span>
    </div>
    <div class="pg-editor" id="editor"></div>
    <div class="pg-outhead">출력<button class="s-btn" id="btnClear" type="button">지우기</button></div>
    <div class="pg-out" id="out" aria-live="polite"></div>
  </section>
  <section class="pg-right">
    <div class="pg-tabs" role="tablist">
      <button type="button" role="tab" data-pane="paneWorld" aria-selected="true">2D 재생</button>
      <button type="button" role="tab" data-pane="pane3d" aria-selected="false">3D 재생</button>
      <button type="button" role="tab" data-pane="paneImgs" aria-selected="false">이미지<span class="badge" id="imgCount"></span></button>
      <button type="button" role="tab" data-pane="paneChart" aria-selected="false">그래프<span class="badge" id="plotCount"></span></button>
    </div>
    <div class="pg-pane on" id="paneWorld">
      <canvas id="world" aria-label="가상 MentorPi 2D 재생"></canvas>
      <div class="pg-legend" id="legend">
        <div><i style="background:var(--accent)"></i>실제 경로 (ground truth)</div>
        <div><i style="background:var(--warn)"></i>오도메트리 추정</div>
        <div><i style="background:var(--danger)"></i>라이다 /scan</div>
      </div>
      <div class="pg-play">
        <button class="s-btn" id="btnPlay" type="button">&#9654;</button>
        <span class="pg-play-t" id="playT">— / — s</span>
        <input type="range" id="seek" min="0" max="0" value="0" aria-label="재생 위치">
        <label><input type="checkbox" id="chkRays" checked> 레이</label>
        <label><input type="checkbox" id="chkOdom" checked> odom</label>
        <select id="speed" aria-label="재생 속도"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option></select>
      </div>
    </div>
    <div class="pg-pane" id="pane3d"><iframe id="f3d" title="MentorPi 3D 재생" style="flex:1;border:0;width:100%" data-src="../sim3d/index.html?embed=replay"></iframe></div>
    <div class="pg-pane" id="paneImgs"><div class="pg-imgs" id="imgs"><div class="pg-empty">코드에서 <code>cv2.imshow("이름", img)</code>를 부르면 여기에 표시됩니다.</div></div></div>
    <div class="pg-pane" id="paneChart"><canvas id="chart" aria-label="그래프"></canvas></div>
    <div class="pg-summary" id="summary">
      <span class="hint">rclpy 코드를 실행하면 가상 MentorPi(메카넘/애커만)가 시뮬레이션 시간으로 움직이고, 경로·라이다가 위에서 재생됩니다.
      지원 API: <a href="https://github.com/samcho93/studyMentorPi/blob/main/docs/PLAYGROUND_API.md" target="_blank" rel="noopener">PLAYGROUND_API.md</a></span>
    </div>
  </section>
</main>
<script type="module" src="playground.js"></script>
</body>
</html>
